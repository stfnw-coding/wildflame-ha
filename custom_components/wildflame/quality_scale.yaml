# Status per rule of the Home Assistant Integration Quality Scale:
# https://contributors.home-assistant.io/core/quality-scale/rules/
# hassfest only checks this file for core integrations; here it documents where this integration stands.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions of its own.
  appropriate-polling:
    status: done
    comment: Local device on its own Wi-Fi; 5 s so changes made on the burner show up quickly.
  brands:
    status: done
    comment: Icons in brand/ of the integration folder (custom integration).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: The client lives in api.py. For Home Assistant core it has to become a library on PyPI.
  docs-actions:
    status: exempt
    comment: The integration registers no actions of its own.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions of its own.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers of its own.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing but the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: There is no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The burner has no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The burner only runs its own access point at a fixed address and announces nothing.
  discovery-update-info:
    status: exempt
    comment: No discovery, see above.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is one burner.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      The only rarely needed entity is the diagnostic phase code. It stays enabled on purpose: its history
      is how unknown (error) codes get noticed and reported.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: There are no problems the user can fix from Home Assistant; a lost connection shows as unavailable.
  stale-devices:
    status: exempt
    comment: One config entry is one burner; removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: >-
      The client takes a session. The integration gives it its own Home Assistant session because the burner
      closes every connection, so a shared keep-alive pool would not help.
  strict-typing: todo
